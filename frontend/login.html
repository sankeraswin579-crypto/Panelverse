<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Sign in · PanelVerse</title><link rel="stylesheet" href="/styles.css"><style>
:root{color-scheme:dark}body.auth-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 15% 10%,rgba(111,91,220,.22),transparent 40%),radial-gradient(ellipse at 90% 90%,rgba(31,154,164,.15),transparent 40%),#10131b;color:#f5f4f1;font-family:Inter,system-ui,sans-serif}.auth-card{width:min(100%,460px);padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(25,29,41,.94);box-shadow:0 28px 90px #0008}.auth-brand{font-size:13px;letter-spacing:.22em;color:#b9a8ff;font-weight:800}.auth-card h1{font-size:34px;line-height:1.1;margin:18px 0 10px}.auth-card p{color:#aeb4c3;line-height:1.6}.auth-tabs{display:flex;gap:8px;margin:26px 0}.auth-tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid #34394b;background:transparent;color:#c9ccda;cursor:pointer}.auth-tabs button.active{background:#6e5ad6;border-color:#6e5ad6;color:white}.auth-form{display:grid;gap:14px}.auth-form label{display:grid;gap:7px;color:#d8d9e2;font-size:13px}.auth-form input{width:100%;padding:13px 14px;border:1px solid #3a4052;border-radius:10px;background:#111520;color:#fff;font:inherit}.auth-form input:focus{outline:2px solid #8571ed;border-color:transparent}.auth-submit{padding:14px;border:0;border-radius:11px;background:#8571ed;color:white;font-weight:750;font-size:15px;cursor:pointer;margin-top:7px}.auth-error{min-height:22px;color:#ff9d9d;font-size:13px}.auth-note{font-size:12px!important;margin-top:24px}.auth-form[hidden]{display:none}
</style></head><body class="auth-page"><main class="auth-card"><div class="auth-brand">✦ PANELVERSE</div><h1>Your multiverse.<br>Your reading journey.</h1><p>Sign in to sync your shelf and reading progress across your devices.</p><div class="auth-tabs"><button type="button" class="active" id="tab-login">Sign in</button><button type="button" id="tab-register">Create account</button></div>
<form class="auth-form" id="login-form"><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="auth-submit">Sign in to PanelVerse</button></form>
<form class="auth-form" id="register-form" hidden><label>Your name<input name="name" autocomplete="name" required minlength="2" maxlength="60" placeholder="Your name"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="200" placeholder="At least 10 characters"></label><button class="auth-submit">Create my account</button></form><div class="auth-error" id="auth-error" role="alert"></div><p class="auth-note">Your account and personal reading data are stored securely in the PanelVerse cloud database.</p></main><script src="/login.js" defer></script></body></html>
